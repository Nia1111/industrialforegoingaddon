plugins {
    id 'java'
    id 'idea'
    id 'maven-publish'

    id 'com.github.johnrengelman.shadow' version '7.1.2'
    id 'com.matthewprenger.cursegradle' version '1.4.0'
    id 'com.modrinth.minotaur' version "2.+"

    id 'net.neoforged.gradle' version '6.0.21'
    id 'org.spongepowered.mixin' version '0.7.+'
}

java.toolchain.languageVersion = JavaLanguageVersion.of("${java_version}")
java.withSourcesJar()

sourceSets.main.resources.srcDirs += "src/main/generated"

group = 'wootrevived'
archivesBaseName = "ifwootaddon"
def buildVersion = "${mod_version}"
version = "${mc_version}-${buildVersion}"

minecraft {
    mappings channel: 'official', version: "${mc_version}"

    runs {
        configureEach {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')

            args '--mod', mod_id, '--all', '--output', file('src/main/generated/'), '--existing', file('src/main/resources/')
        }
    }
}

processResources {
    filesMatching('META-INF/mods.toml') {
        expand 'file': [
                        'modId': mod_id,
                        'modName': mod_name,
                        'jarVersion': mod_version
                ],
                'mc_version': mc_version,
                'neo_version': neo_version,
                'woot_version': woot_version,
                'if_version': if_version,
                'neo_major_version': neo_version.split('\\.')[0]
    }
}

configurations {
    annotationProcessor.extendsFrom minecraft
    shadowIn
    implementation.extendsFrom shadowIn
}

repositories {
    mavenLocal()
    mavenCentral()
    maven { url = "https://maven.neoforged.net/releases" }
    maven { url = "https://maven.minecraftforge.net/" }
    maven { url = "https://maven.blamejared.com/" }
    maven { url = "https://maven.creeperhost.net" }
    maven { url = "https://api.modrinth.com/maven" }
}

dependencies {
    minecraft "net.neoforged:forge:${mc_version}-${neo_version}"

    compileOnly 'org.jetbrains:annotations:22.0.0'

    // JEI
    compileOnly fg.deobf("mezz.jei:jei-${mc_version}-common-api:${jei_version}")
    compileOnly fg.deobf("mezz.jei:jei-${mc_version}-forge-api:${jei_version}")
    runtimeOnly fg.deobf("mezz.jei:jei-${mc_version}-forge:${jei_version}")

    // Jade
    implementation fg.deobf("maven.modrinth:jade:${jade_version}")

    // Woot
    implementation fg.deobf("maven.modrinth:woot-revived:${mc_version}-${woot_version}")
    runtimeOnly fg.deobf("maven.modrinth:guideme:${guideme_version}")

    // Industrial Foregoing
    implementation fg.deobf("maven.modrinth:industrial-foregoing:${if_version}")
    implementation fg.deobf("maven.modrinth:titanium:${titanium_version}")

    // Optimizations
    runtimeOnly fg.deobf("org.embeddedt:embeddium-${mc_version}:${embeddium_version}")
    runtimeOnly fg.deobf("maven.modrinth:modernfix:${modernfix_version}")
    runtimeOnly fg.deobf("maven.modrinth:ferrite-core:${ferritecore_version}")
}

shadowJar {
    finalizedBy 'reobfShadowJar'
    archiveClassifier = ''
    manifest {
        attributes([
                'Specification-Title'     : "${mod_name}",
                'Specification-Vendor'    : 'pharuxtan',
                'Specification-Version'   : "${mc_version}",
                'Implementation-Title'    : "${mod_id}",
                'Implementation-Vendor'   : 'pharuxtan',
                'Implementation-Version'  : "${mod_version}",
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    configurations = [project.configurations.shadowIn]

    doFirst {
        exclude '.cache/**'
    }
}

reobf {
    shadowJar {}
    jar { enabled = false }
}

jar.enabled = false

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-Xlint:deprecation', '-Xlint:unchecked']
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}